<html lang="de">

    </head>
    <body>
        <div id="main">

        </div>
        <input type="text" id="seed"><button onclick="Seeding();">Anwenden</button><button onclick="randomPattern();">Zufälliges Muster</button><button onclick="randomSeed()">Zufälliger Seed</button>
        <hr>
        <input type="color" id="farbe">
        <hr>
        <br>
        <div><div class="anzeige" id="anzeige"></div><div id="watchColor"></div><div id="realColor"></div></div>
        <textarea id="makeCode">
                        function colorBlack(){

                                        if(e.dataset.color.endsWith('), 0') === true){

                        colorBlack();
        </textarea><button onclick="setAlgo()">Ausführen</button>
        <script>
            const anzeige = document.getElementById('anzeige');
            const watchColor = document.getElementById('watchColor');
            const realColor = document.getElementById('realColor');
            const main = document.getElementById('main');
            const makeCode = document.getElementById('makeCode');

            // Generate Pattern //
            let bisher = 0;
            let stellen = 0;
            let ziel = 256;
            let wert = 1;
            let startColor = 'hsl(240,100%,50%)';
            let selectet;

            document.getElementById('farbe').addEventListener('change',(e) => {
                bisher = 0;
                stellen = 0;
                ziel = 256;
                wert = 1;
                main.innerHTML = '';
                startColor = document.getElementById('farbe').value;
                console.warn(document.getElementById('farbe').value);
                make();
            });

            function setAlgo(){
                let code = makeCode.value;
                eval(code);
                alert(`Der code wurde ausgeführt (\n${code})`);
            }

            function reset(){
                bisher = 0;
                stellen = 0;
                ziel = 256;
                wert = 1;
                startColor = 'hsl(240,100%,50%)';
                main.innerHTML = '';
                make();
            }
            // Erstellen der Knöpfe
            function make(){
                const diver = document.createElement('button');
                diver.id = wert;
                diver.dataset.hue = 240;
                diver.dataset.color = startColor;
                diver.style = 'border: 1px solid #ccc; background-color: ' + startColor + '; width: 25px; height: 25px;';
                diver.style.backgroundColor = diver.dataset.hue;
                diver.onclick = () => {alert(diver.id);};
                main.appendChild(diver);
                if(document.getElementById(diver.id)){
                    console.log('Diver mit id ' + diver.id + ' und hue ' + diver.dataset.hue + ' erstellt');
                }
                //if(stner.includes(bisher+1)){document.body.appendChild(document.createElement('br'));}
                readyCheck();
            }
            let stner = [
                16,
                32,
                48,
                64,
                80,
                96,
                112,
                128,
                144,
                160,
                176,
                192,
                208,
                224,
                240,
                256
            ]
            function readyCheck() {
                wert++;
                bisher++;
                console.log(bisher);
                if(bisher === ziel){
                    console.log('Erfolg, ziel von ' + ziel + ' erreicht mit ' + bisher + ' divern');
                    const divs = document.querySelectorAll('button[data-hue]');
                    divs.forEach((e) => {
                        e.addEventListener('mouseenter',(b) => {
                            Select(e.id);
                        });
                    });
                }else {
                    setTimeout(make,10);
                }
            }
            reset();
            // Select
            function Select(id){
                const obj = document.getElementById(id);
                selectet = [id];

                anzeige.innerText = `ID: ${obj.id}
                Farbe: ${obj.style.backgroundColor}
                Data-Hue: ${obj.dataset.hue}
                Data-Color: ${obj.dataset.color}`;

                watchColor.style.backgroundColor = obj.style.backgroundColor;
                watchColor.innerText = `${obj.id}\n${obj.style.backgroundColor}\n${obj.dataset.hue} deg`;

                realColor.style.backgroundColor = obj.style.backgroundColor;
            }

            // Seeding //
            const seedInput = document.getElementById('seed');
            
            function Seeding(){
                const divs = document.querySelectorAll('button[data-hue]');
                let seed = seedInput.value.trim();
                seed = seed.toLowerCase();
                console.log('Vorher: ' + seed);
                seed = seed.replaceAll('a','1');
                seed = seed.replaceAll('b','2');
                seed = seed.replaceAll('c','3');
                seed = seed.replaceAll('d','4');
                seed = seed.replaceAll('e','5');
                seed = seed.replaceAll('f','6');
                seed = seed.replaceAll('g','7');
                seed = seed.replaceAll('h','8');
                seed = seed.replaceAll('i','9');
                seed = seed.replaceAll('j','10');
                seed = seed.replaceAll('k','11');
                seed = seed.replaceAll('l','12');
                seed = seed.replaceAll('m','13');
                seed = seed.replaceAll('n','14');
                seed = seed.replaceAll('o','15');
                seed = seed.replaceAll('p','16');
                seed = seed.replaceAll('q','17');
                seed = seed.replaceAll('r','18');
                seed = seed.replaceAll('s','19');
                seed = seed.replaceAll('t','20');
                seed = seed.replaceAll('u','21');
                seed = seed.replaceAll('v','22');
                seed = seed.replaceAll('w','23');
                seed = seed.replaceAll('x','24');
                seed = seed.replaceAll('y','25');
                seed = seed.replaceAll('z','26');
                seed = seed.replaceAll('!','27');
                seed = seed.replaceAll('?','28');
                seed = seed.replaceAll('"','29');
                seed = seed.replaceAll('§','30');
                seed = seed.replaceAll('$','31');
                seed = seed.replaceAll('%','32');
                seed = seed.replaceAll('&','33');
                seed = seed.replaceAll('/','34');
                seed = seed.replaceAll('(','35');
                seed = seed.replaceAll(')','36');
                seed = seed.replaceAll('=','37');
                seed = seed.replaceAll('+','38');
                seed = seed.replaceAll('*','39');
                seed = seed.replaceAll('~','40');
                seed = seed.replaceAll(`'`,'41');
                seed = seed.replaceAll('`','42');
                seed = seed.replaceAll('-','43');
                seed = seed.replaceAll('_','44');
                seed = seed.replaceAll('.','45');
                seed = seed.replaceAll(':','46');
                seed = seed.replaceAll(',','47');
                seed = seed.replaceAll(';','48');
                seed = seed.replaceAll('<','49');
                seed = seed.replaceAll('>','50');
                seed = seed.replaceAll('|','51');
                seed = seed.replaceAll('°','52');
                seed = seed.replaceAll('^','53');
                seed = seed.replaceAll(` `,'54');

                console.log('Nachher: ' + seed);
                console.log(divs);

                divs.forEach((e) => {
                    let seeded = Number(seed);
                    if(seeded >= 360){
                        seeded = seeded/e.id;
                        seeded = seeded.toFixed(0);
                    }else {
                        seeded = seeded+e.id;
                        if(seeded >= 360){zufällig
                            seeded = seeded/360+e.id;
                            seeded = seeded.toFixed(0);
                        }
                    }
                    e.style.backgroundColor = `hsl(${seeded},100%,50%)`;
                    e.dataset.hue = seeded;
                    e.dataset.color = `hsl(${seeded},100%,50%)`;
                    e.onclick = () => {alert('ID: ' + e.id + ' Farbe: ' + hslToHex(seeded,100,50));};
                    console.log(seeded);
                });
            }
            function hslToHex(h, s, l) {
                let H = Number(h);
                let S = Number(s);
                let L = Number(l);
                L /= 100;
                const a = S * Math.min(L, 1 - L) / 100;
                const f = n => {
                    const k = (n + H / 30) % 12;
                    const color = L - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                    return Math.round(255 * color).toString(16).padStart(2, '0');
                };
                return `#${f(0)}${f(8)}${f(4)}`;
                }

            function random(min, max) {seedInput.value
                min = Math.ceil(min);
                max = Math.floor(max);
                return Math.floor(Math.random() * (max - min)) + min;
            }

            function randomPattern(){
                const divs = document.querySelectorAll('button[data-hue]');
                divs.forEach((e) => {
                    let hueWert = parseFloat(random(0,360));
                    let satWert = parseFloat(random(0,100));
                    let helWert = parseFloat(random(0,100));
                    e.dataset.hue = hueWert;
                    e.style.backgroundColor = 'hsl(' + hueWert + ',' + satWert + '%,' + helWert + '%)';
                    e.dataset.color = e.style.backgroundColor + ', ' + helWert;
                });
            }
            
            function randomSeed(){
                let wert = random(100000,99999999);
                seedInput.value = wert;
            }
        </script>
